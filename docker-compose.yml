version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: url_shortener_db
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  backend:
    build: ./backend
    container_name: url_shortener_backend
    ports:
      - "8000:8000"
    environment:
      - URI=mongodb://mongodb:27017/urlshortener
      - PORT=8000
    depends_on:
      - mongodb

  client:
    build: ./client
    container_name: url_shortener_client
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_BACKEND_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  mongodb_data:
